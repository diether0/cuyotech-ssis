<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashier Module - CuyoTech SSIS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img class="logo" src="assets/pnc-seal.png" alt="Pamantasan ng Cabuyao seal"><span>CuyoTech<br>SSIS</span></div>
    <nav>
      <a href="cashier.html" class="active">Payments &amp; Receipts</a>
      <a href="#" id="logout">Logout</a>
    </nav>
    <div class="foot">Cashier Module<br>&copy; 2026</div>
  </aside>

  <div class="content">
    <div class="topbar">
      <div class="hint">Cashiering Office</div>
      <div class="user">
        <div class="avatar" id="avatar">RC</div>
        <div>
          <div id="userName" style="font-weight:600;font-size:13px">Name</div>
          <div class="hint">Cashier</div>
        </div>
      </div>
    </div>

    <div class="main">
      <h1 class="page-title">Payments &amp; Receipts</h1>
      <p class="page-sub">Collect payments and issue official receipt numbers.</p>

      <div class="grid cols-3">
        <div class="card stat"><div class="label">Total Collected</div><div class="value small" id="collected">-</div></div>
        <div class="card stat"><div class="label">Outstanding</div><div class="value small" id="outstanding">-</div></div>
        <div class="card stat"><div class="label">Transactions</div><div class="value" id="txnCount">-</div></div>
      </div>

      <div class="card section-card">
        <h3>Payment Records</h3>
        <table>
          <thead><tr><th>Student</th><th>Description</th><th>Amount</th><th>Receipt No.</th><th>Date Paid</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="payBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  var s = SSIS.requireRole(["cashier", "admin"]);
  if (s) {
    document.getElementById("userName").textContent = s.name;
    document.getElementById("avatar").textContent = SSIS.initials(s.name);
  }

  function studentName(id) {
    var d = SSIS.db();
    var st = SSIS.byId(d.students, "student_id", id);
    return st ? st.full_name : id;
  }

  function render() {
    var d = SSIS.db();
    var rows = d.payments.map(function (p) {
      var action = p.status === "paid" ? '<span class="hint">Paid</span>'
        : '<button class="btn small success" data-pay="' + p.payment_id + '">Process</button>';
      return '<tr><td>' + studentName(p.student_id) + '</td><td>' + p.description + '</td>' +
        '<td>' + SSIS.money(p.amount) + '</td><td>' + (p.receipt_no || '-') + '</td><td>' + (p.date_paid || '-') +
        '</td><td>' + SSIS.badge(p.status) + '</td><td>' + action + '</td></tr>';
    }).join('');
    document.getElementById("payBody").innerHTML = rows;

    var collected = d.payments.filter(function (p) { return p.status === "paid"; }).reduce(function (a, p) { return a + p.amount; }, 0);
    var outstanding = d.payments.filter(function (p) { return p.status !== "paid"; }).reduce(function (a, p) { return a + p.amount; }, 0);
    document.getElementById("collected").textContent = SSIS.money(collected);
    document.getElementById("outstanding").textContent = SSIS.money(outstanding);
    document.getElementById("txnCount").textContent = d.payments.filter(function (p) { return p.status === "paid"; }).length;

    document.querySelectorAll("[data-pay]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-pay");
        var d = SSIS.db();
        var p = SSIS.byId(d.payments, "payment_id", id);
        p.status = "paid";
        p.date_paid = new Date().toISOString().slice(0, 10);
        p.receipt_no = "OR-2026-" + String(Math.floor(Math.random() * 9000) + 1000);
        SSIS.save(d);
        SSIS.log(s.username, "Processed payment #" + id + " (" + p.receipt_no + ")");
        render();
      });
    });
  }

  if (s) render();
  document.getElementById("logout").addEventListener("click", function (e) { e.preventDefault(); SSIS.logout(); });
</script>
</body>
</html>
